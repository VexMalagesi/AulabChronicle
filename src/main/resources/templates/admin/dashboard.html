<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>

<nav th:replace="~{index :: navbar}"></nav>

<div class="container mt-3">
    <div th:if="${successMessage}" class="alert alert-success">
        <p class="mb-0" th:text="${successMessage}"></p>
    </div>
</div>

<div class="container min-vh-100">
    <div class="row">
        <div class="col-12 my-5 d-flex justify-content-center align-items-center">
            <span class="h1">Dashboard Admin</span>
        </div>

        <!-- Richieste di collaborazione -->
        <div class="col-12 my-3 d-flex justify-content-center align-items-center">
            <span class="h3" th:text="${title}">Richieste ricevute</span>
        </div>
        <div class="col-12">
            <table class="table table-striped table-responsive-lg">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Utente</th>
                    <th>Ruolo richiesto</th>
                    <th class="text-end">Azioni</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="request : ${requests}">
                    <td th:text="${request.id}"></td>
                    <td th:text="${request.user.username}"></td>
                    <td th:text="${#strings.substring(request.role.name, 5)}"></td>
                    <td class="text-end">
                        <a th:href="@{/operations/career/request/detail/{id}(id=${request.id})}" class="btn btn-primary m-2">
                            <i class="fa-solid fa-eye"></i> Dettaglio
                        </a>
                    </td>
                </tr>
                <tr th:if="${requests.size() == 0}">
                    <td colspan="4" class="text-center">Nessuna richiesta da controllare</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Gestione categorie -->
        <div class="col-12 my-3 d-flex justify-content-center align-items-center">
            <span class="h3">Tutte le categorie</span>
            <a th:href="@{/categories/create}" class="btn btn-primary m-2">
                <i class="fa-solid fa-plus"></i>
            </a>
        </div>
        <div class="col-12">
            <table class="table table-striped table-responsive-lg">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th class="text-end">Azioni</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}"></td>
                    <td th:text="${category.name}"></td>
                    <td class="text-end">
                        <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-warning m-2">
                            <i class="fa-solid fa-pencil"></i>
                        </a>
                        <a th:href="@{/categories/delete/{id}(id=${category.id})}" class="btn btn-danger m-2"
                           onclick="return confirm('Vuoi davvero cancellare questa categoria?');">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>
<script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
