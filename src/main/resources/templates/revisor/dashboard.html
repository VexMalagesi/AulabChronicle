<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>

<nav th:replace="~{index :: navbar}"></nav>

<div class="container mt-3">
    <div th:if="${resultMessage}" class="alert alert-success">
        <p class="mb-0" th:text="${resultMessage}"></p>
    </div>
</div>

<div class="container min-vh-100">
    <div class="row">
        <div class="col-12 my-5 d-flex justify-content-center align-items-center">
            <span class="h1">Dashboard Revisore</span>
        </div>

        <div class="col-12 my-3 d-flex justify-content-center align-items-center">
            <span class="h3" th:text="${title}">Articoli da revisionare</span>
        </div>

        <div class="col-12">
            <table class="table table-striped table-responsive-lg">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Titolo</th>
                    <th>Sottotitolo</th>
                    <th>Categoria</th>
                    <th class="text-end">Azioni</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="article : ${articles}">
                    <td th:text="${article.id}"></td>
                    <td th:text="${article.title}"></td>
                    <td th:text="${article.subtitle}"></td>
                    <td th:if="${article.category != null}" th:text="${article.category.name}"></td>
                    <td th:unless="${article.category != null}">Nessuna categoria</td>
                    <td class="text-end">
                        <a th:href="@{/articles/revisor/detail/{id}(id=${article.id})}" class="btn btn-primary m-2">Leggi</a>
                    </td>
                </tr>
                <tr th:if="${articles.size() == 0}">
                    <td colspan="5" class="text-center">Nessun articolo da revisionare</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>
<script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
