<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>

<nav th:replace="~{index :: navbar}"></nav>

<div class="min-vh-100">
    <div class="container mt-3">
        <div th:if="${successMessage}" class="alert alert-success">
            <p class="mb-0" th:text="${successMessage}"></p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 my-5">
                <h1 class="text-center" th:text="${title}">Index articoli</h1>
            </div>
        </div>
    </div>

    <div class="container" th:if="${articles.size() > 0}">
        <div class="row justify-content-center mb-5">
            <div th:each="article : ${articles}" class="col-12 col-md-6 col-lg-4 d-flex justify-content-center mb-4">
                <div class="card h-100" style="width: 20rem;">
                    <img th:if="${article.image != null}" th:src="${article.image.path}" class="card-img-top" alt="Immagine articolo" style="height: 200px; object-fit: cover;">
                    <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}" class="card-img-top" alt="Immagine di default" style="height: 200px; object-fit: cover;">

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${article.title}">Titolo</h5>
                        <p class="card-text" th:text="${article.subtitle}">Sottotitolo</p>
                        <p class="card-text text-muted small">
                            <a th:if="${article.category != null}" class="text-muted text-capitalize"
                               th:href="@{/categories/search/{id}(id=${article.category.id})}" th:text="${article.category.name}">categoria</a>
                            <span th:if="${article.user != null}">-
                                <a class="text-muted" th:href="@{/search/{id}(id=${article.user.id})}" th:text="${article.user.username}">autore</a>
                            </span>
                        </p>
                        <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary mt-auto">Leggi</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center vh-100" th:unless="${articles.size() > 0}">
        <div class="col-12 col-md-8">
            <h2 class="text-center">NESSUN ARTICOLO PRESENTE</h2>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>
<script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
