<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>

<nav th:replace="~{index :: navbar}"></nav>

<div class="min-vh-100">
    <div class="container">
        <div class="row">
            <div class="col-12 my-5 d-flex justify-content-center">
                <h1 th:text="${title}">Richiesta collaborazione</h1>
            </div>

            <div class="col-12 col-md-8 offset-md-2 mb-5">
                <form th:action="@{/operations/career/request/save}" method="POST" th:object="${careerRequest}">
                    <div class="mb-3">
                        <label for="body" class="form-label">Motivo della richiesta</label>
                        <textarea id="body" class="form-control" rows="5" th:field="*{body}"
                                  placeholder="Inserisci la motivazione..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Per quale ruolo?</label>
                        <select id="role" th:field="*{role}" class="form-select">
                            <option th:each="role : ${roles}" th:value="${role.id}"
                                    th:text="${#strings.substring(role.name, 5)}"></option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success">Effettua richiesta</button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>
<script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
