<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>

<nav th:replace="~{index :: navbar}"></nav>

<div class="min-vh-100">
    <div class="container-fluid p-5 bg-secondary-subtle text-center">
        <div class="row justify-content-center">
            <div class="col-12">
                <span class="h1">Richiesta</span>
            </div>
        </div>
    </div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 d-flex flex-column">
                <div class="text-center">
                    <h2 th:text="${request.user.username}">Nome utente</h2>
                    <p class="text-muted">Ruolo richiesto:
                        <span class="fw-bold" th:text="${#strings.substring(request.role.name, 5)}">ruolo</span>
                    </p>
                </div>
                <hr>
                <p th:text="${request.body}">Body</p>

                <div class="d-flex justify-content-center">
                    <form th:action="@{/operations/career/request/accept/{id}(id=${request.id})}" method="post">
                        <button type="submit" class="btn btn-primary m-2">Accetta</button>
                    </form>
                    <a th:href="@{/admin/dashboard}" class="btn btn-secondary m-2">Torna indietro</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>
<script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
