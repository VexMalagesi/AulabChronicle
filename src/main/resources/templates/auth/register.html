<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>

<nav th:replace="~{index :: navbar}"></nav>

<div class="container my-5">
    <div class="row col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Registrazione</h2>
            </div>
            <div th:if="${param.success}">
                <div class="alert alert-info">
                    Ti sei registrato con successo!
                </div>
            </div>
            <div class="card-body">
                <form method="post" role="form" th:action="@{/register/save}" th:object="${user}">
                    <div class="form-group mb-3">
                        <label class="form-label">Nome</label>
                        <input class="form-control" id="firstName" name="firstName" placeholder="Inserisci il tuo nome"
                               th:field="*{firstName}" type="text"/>
                        <p th:errors="*{firstName}" class="text-danger" th:if="${#fields.hasErrors('firstName')}"></p>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Cognome</label>
                        <input class="form-control" id="lastName" name="lastName" placeholder="Inserisci il tuo cognome"
                               th:field="*{lastName}" type="text"/>
                        <p th:errors="*{lastName}" class="text-danger" th:if="${#fields.hasErrors('lastName')}"></p>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" id="email" name="email" placeholder="Inserisci la tua email"
                               th:field="*{email}" type="email"/>
                        <p th:errors="*{email}" class="text-danger" th:if="${#fields.hasErrors('email')}"></p>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Password</label>
                        <input class="form-control" id="password" name="password" placeholder="Inserisci la password"
                               th:field="*{password}" type="password"/>
                        <p th:errors="*{password}" class="text-danger" th:if="${#fields.hasErrors('password')}"></p>
                    </div>
                    <div class="form-group">
                        <button class="btn btn-primary" type="submit">Registrati</button>
                        <span class="ms-2">Hai già un account? <a th:href="@{/login}">Accedi qui</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>
<script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
