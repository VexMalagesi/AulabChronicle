<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: head}"></head>
<body>

<nav th:replace="~{index :: navbar}"></nav>

<div class="container my-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div th:if="${param.error}">
                <div class="alert alert-danger">Email o password non validi.</div>
            </div>
            <div th:if="${param.logout}">
                <div class="alert alert-success">Logout effettuato.</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h2 class="text-center">Login</h2>
                </div>
                <div class="card-body">
                    <form method="post" role="form" th:action="@{/login}" class="form-horizontal">
                        <div class="form-group mb-3">
                            <label class="control-label">Email</label>
                            <input type="text" id="username" name="username" class="form-control"
                                   placeholder="Inserisci la tua email"/>
                        </div>
                        <div class="form-group mb-3">
                            <label class="control-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control"
                                   placeholder="Inserisci la password"/>
                        </div>
                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-primary">Accedi</button>
                            <span class="ms-2">Non sei registrato?
                                <a th:href="@{/register}">Registrati qui</a>
                            </span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>
<script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
