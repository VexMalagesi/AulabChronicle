<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{index :: head}"></head>
<body>

<nav th:replace="~{index :: navbar}"></nav>

<div class="container mt-3">
    <div th:if="${param.notAuthorized}" class="alert alert-danger">
        Non sei autorizzato!
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
        <p class="mb-0" th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p class="mb-0" th:text="${errorMessage}"></p>
    </div>
</div>

<div class="container-fluid">
    <div class="row mx-5 py-5 align-items-center">
        <div class="col-12 text-center">
            <h1 class="mb-4">Benvenuto in <span class="display-4 fw-bold d-block">The Aulab Chronicle</span></h1>
            <a sec:authorize="isAuthenticated() and hasRole('ROLE_WRITER')" th:href="@{/articles/create}" class="btn btn-primary btn-lg">
                Inserisci articolo
            </a>
        </div>
    </div>
</div>

<div class="container" th:if="${articles.size() > 0}">
    <div class="row justify-content-center">
        <div class="col-12 my-4">
            <h2 class="text-center">Gli ultimi articoli</h2>
        </div>
    </div>
    <div class="row justify-content-center mb-5">
        <div th:each="article : ${articles}" class="col-12 col-md-6 col-lg-4 d-flex justify-content-center mb-4">
            <div class="card h-100" style="width: 20rem;">
                <img th:if="${article.image != null}" th:src="${article.image.path}" class="card-img-top" alt="Immagine articolo" style="height: 200px; object-fit: cover;">
                <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}" class="card-img-top" alt="Immagine di default" style="height: 200px; object-fit: cover;">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${article.title}">Titolo</h5>
                    <p class="card-text" th:text="${article.subtitle}">Sottotitolo</p>
                    <p class="card-text text-muted small" th:text="${article.user != null ? article.user.username : ''}">autore</p>
                    <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary mt-auto">Leggi</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{index :: footer}"></footer>
<script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
